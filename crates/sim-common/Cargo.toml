[package]
name = "sim-common"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "sim_common"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.75"
axum = "0.6.7"
hdrhistogram = "7.5"
parking_lot = "0.12"
prometheus = "0.13.3"
tracing = "0.1.37"
uuid = { version = "1.3.0", features = ["v4", "v5"] }

notification_service = { version = "0.1.0", path = "../notification_service" }

[dev-dependencies]
tokio = { version = "1.29.1", features = ["macros", "rt"] }
