[package]
name = "sim-producer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "sim-producer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.75"
chrono = { version = "0.4.23", features = ["serde"] }
fred = { version = "9.4.0", features = ["i-cluster", "i-pubsub"] }
governor = "0.6"
prometheus = "0.13.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_dhall = "0.12.1"
serde_json = "1.0"
tokio = { version = "1.29.1", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
uuid = { version = "1.3.0", features = ["v4", "v5"] }

shared = { git = "https://github.com/nammayatri/shared-kernel-rs", rev = "f643312" }
notification_service = { version = "0.1.0", path = "../notification_service" }
sim-common = { version = "0.1.0", path = "../sim-common" }
